server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:8889/phonecaseshop?useSSL=false&serverTimezone=Asia/Taipei&allowPublicKeyRetrieval=true}
# spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/phonecaseshop?useSSL=false&serverTimezone=Asia/Taipei&allowPublicKeyRetrieval=true}
