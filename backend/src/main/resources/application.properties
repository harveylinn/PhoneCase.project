# Spring Boot 專案名稱
spring.application.name=backend

# ==============================
# 伺服器設定
# ==============================

server.port=8080

# ==============================
# MySQL 資料庫連線
# ==============================

# 預設使用組長的 phonecaseshop
# 個人開發可以透過 DB_URL 切換資料庫
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/phonecaseshop?useSSL=false&serverTimezone=Asia/Taipei&allowPublicKeyRetrieval=true}

# MySQL 帳號
spring.datasource.username=${DB_USERNAME:root}

# MySQL 密碼
spring.datasource.password=${DB_PASSWORD:123}

# MySQL 驅動程式
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==============================
# Spring Data JPA
# ==============================

# 不自動修改資料表
spring.jpa.hibernate.ddl-auto=none

# 顯示 SQL
spring.jpa.show-sql=true

# 保留 develop 的設定
spring.jpa.open-in-view=true