# Spring Boot 專案名稱
spring.application.name=backend

# ==============================
# 伺服器設定
# ==============================

server.port=8080

# ==============================
# MySQL 資料庫連線
# ==============================

# 預設使用組長的 phonecaseshop
# 個人開發可以透過 DB_URL 切換資料庫
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/phonecaseshop?useSSL=false&serverTimezone=Asia/Taipei&allowPublicKeyRetrieval=true}

# MySQL 帳號
spring.datasource.username=${DB_USERNAME:root}

# MySQL 密碼
spring.datasource.password=${DB_PASSWORD:root}

# MySQL 驅動程式
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==============================
# Spring Data JPA
# ==============================

# 不自動修改資料表
spring.jpa.hibernate.ddl-auto=none

# 顯示 SQL
spring.jpa.show-sql=true

# 保留 develop 的設定
spring.jpa.open-in-view=true

# Spring AI 使用本機 Ollama；可由環境變數覆寫模型或服務位址。
spring.ai.model.chat=ollama
spring.ai.ollama.base-url=http://127.0.0.1:11434
spring.ai.ollama.chat.model=qwen2.5vl:3b
spring.ai.ollama.chat.num-ctx=8192

# 公開的 Web Client ID；可使用環境變數覆蓋
app.google.client-id=${GOOGLE_CLIENT_ID:44863714919-6b9t1o9nao0rm4ts3ah13qu81ta0caut.apps.googleusercontent.com}
# Session 只暫存 Google 登入挑戰，不用來取代本站 JWT
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
