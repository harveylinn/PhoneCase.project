<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>註冊會員</title>
</head>
<body>
<main>
<h1>會員註冊</h1>
<formdata-demo-next="profile.html">
  <div><label class="form-label" for="account">帳號</label><input class="form-control" type="text" id="account" name="account" autocomplete="username" required></div>
  <div><label class="form-label" for="email">Email</label><input class="form-control" type="email" id="email" name="email" autocomplete="email" required></div>
  <div><label class="form-label" for="password">密碼</label><input class="form-control" type="password" id="password" name="password" autocomplete="new-password" required></div>
  <div><label class="form-label" for="confirmPassword">確認密碼</label><input class="form-control" type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password" required></div>
  <div><label class="form-label" for="name">姓名</label><input class="form-control" type="text" id="name" name="name" autocomplete="name" required></div>
  <div><label class="form-label" for="phone">電話</label><input class="form-control" type="tel" id="phone" name="phone" autocomplete="tel"></div>
  <button type="submit">註冊</button><button type="reset">清除</button>
</formdata-demo-next=>
</main>
    
</body>
</html>
